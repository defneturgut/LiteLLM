# =============================================================================
#  LiteLLM Proxy yapilandirmasi  --  TAMAMEN GERCEK
# =============================================================================
#  Hicbir sahte (mock) sunucu yok. Buradaki her model, senin makinende
#  gercekten calisan bir LLM'dir:
#
#    OLLAMA (senin kurdugun, host'ta 11434)
#      qwen2.5:0.5b   -> Alibaba Qwen2.5 0.5B Instruct
#      llama3.2:1b    -> Meta Llama 3.2 1B Instruct
#
#    LLAMA.CPP (docker container, ayni Llama agirliklari, farkli motor)
#      llama-a -> ikinci gercek backend (yuk dagitimi icin)
#
#  Model listesi:  ollama list
#  Yeni model:     ollama pull <model>   sonra buraya bir satir ekle
# =============================================================================

model_list:

  # ---------------------------------------------------------------------------
  # 1) QWEN 2.5 0.5B -- Ollama uzerinden (en kucuk, en hizli)
  #
  #    "ollama_chat/" oneki: LiteLLM'in Ollama'nin SOHBET API'siyle konusmasini
  #    saglar. ("ollama/" de var ama eski /api/generate ucunu kullanir --
  #    sohbet modelleri icin ollama_chat tercih edilir.)
  # ---------------------------------------------------------------------------
  - model_name: qwen
    litellm_params:
      model: ollama_chat/qwen2.5:0.5b
      api_base: http://host.docker.internal:11434
      timeout: 7200
      tags: ["default"]        # etiketi eslesmeyen istekler buraya duser
    model_info:
      id: ollama-qwen
      mode: chat
      # Kendi donanimindaysa API ucreti YOKTUR. Uydurma fiyat yazmiyoruz.
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  # ---------------------------------------------------------------------------
  # 2) LLAMA 3.2 1B -- IKI GERCEK BACKEND, ayni model adi altinda
  #    Biri Ollama, digeri llama.cpp. Ikisi de gercekten calisiyor.
  #    Kurumsal karsiligi: ayni modeli iki farkli altyapida kosturmak.
  # ---------------------------------------------------------------------------
  - model_name: llama
    litellm_params:
      model: ollama_chat/llama3.2:1b
      api_base: http://host.docker.internal:11434
      timeout: 7200
      tags: ["default"]        # etiketi eslesmeyen istekler buraya duser
    model_info:
      id: ollama-llama
      mode: chat
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  - model_name: llama
    litellm_params:
      model: hosted_vllm/llama-3.2-1b        # llama.cpp container'i
      api_base: http://llama-a:8080/v1
      api_key: "gerekmiyor"
      timeout: 7200
      tags: ["default"]        # etiketi eslesmeyen istekler buraya duser
    model_info:
      id: llamacpp-a
      mode: chat
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  - model_name: qwen-1.5b
    litellm_params:
      model: hosted_vllm/qwen2.5-1.5b
      api_base: http://qwen-1_5b:8080/v1
      api_key: "gerekmiyor"
      timeout: 7200
      tags: ["default"]
    model_info:
      id: qwen-1_5b
      mode: chat
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  # ---------------------------------------------------------------------------
  # 2b) ETIKET BAZLI YONLENDIRME -- ayni model adi, istegin etiketine gore
  #     farkli backend. Kurumsal karsiligi: "AB musterisinin verisi AB
  #     bolgesindeki deployment'a gitsin" (veri ikametgahi / data residency).
  #
  #     router_settings.enable_tag_filtering: true  ile calisir.
  #     Istekte:  {"model": "bolgesel", "tags": ["bolge:eu"]}
  # ---------------------------------------------------------------------------
  - model_name: bolgesel
    litellm_params:
      model: ollama_chat/llama3.2:1b
      api_base: http://host.docker.internal:11434
      tags: ["bolge:tr"]
      timeout: 7200
    model_info:
      id: bolge-tr
      mode: chat

  - model_name: bolgesel
    litellm_params:
      model: hosted_vllm/llama-3.2-1b
      api_base: http://llama-a:8080/v1
      api_key: "gerekmiyor"
      tags: ["bolge:eu"]
      timeout: 7200
    model_info:
      id: bolge-eu
      mode: chat

  # ---------------------------------------------------------------------------
  # 3) AGENT MODELI -- tool calling icin yeterince buyuk
  #
  #    OLCULEN GERCEK (Ders 02): Llama 3.2 1B ayni tool istegine 3 denemede
  #    1 kez tool_calls uretmedi, 1 kez de SEMAYI arguman sanip geri yansitti.
  #    Agent dongusu icin >= 3B ve tool calling'e egitilmis model sart.
  #    Kurulum:  ollama pull qwen2.5:3b
  # ---------------------------------------------------------------------------
  - model_name: agent-model
    litellm_params:
      model: ollama_chat/qwen2.5:3b
      api_base: http://host.docker.internal:11434
      timeout: 7200                     # agent adimlari uzun surebilir
      tags: ["default"]        # etiketi eslesmeyen istekler buraya duser
    model_info:
      id: ollama-agent
      mode: chat
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      supports_function_calling: true

  # ---------------------------------------------------------------------------
  # 4) EMBEDDING MODELI -- RAG icin
  #    ONEMLI: sohbet modelleri embed EDEMEZ. Ollama'da qwen2.5:0.5b'ye
  #    embed istegi atarsan HTTP 501 doner (olculdu). Ayri model gerekir.
  #    Kurulum:  ollama pull nomic-embed-text
  # ---------------------------------------------------------------------------
  - model_name: embedding
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434
      timeout: 7200
      tags: ["default"]        # etiketi eslesmeyen istekler buraya duser
    model_info:
      id: ollama-embed
      mode: embedding
      input_cost_per_token: 0.0

  # ---------------------------------------------------------------------------
  # 5) IC MALIYET DAGITIMI (chargeback)  --  UYDURMA DEGIL, GERCEK BIR PRATIK
  #
  #    Kendi hostladigin modelin API ucreti yoktur ama SIFIR maliyetli de
  #    degildir: elektrik, donanim amortismani, operasyon. Sirketler bu
  #    maliyeti ekiplere dagitmak icin token basina bir ic tarife tanimlar.
  #
  #    Model gercek; fiyat ise senin belirledigin muhasebe parametresidir.
  #    Butce ve harcama mekanizmalarini bu model uzerinden gorursun.
  # ---------------------------------------------------------------------------
  - model_name: qwen-chargeback
    litellm_params:
      model: ollama_chat/qwen2.5:0.5b
      api_base: http://host.docker.internal:11434
      timeout: 7200
      tags: ["default"]        # etiketi eslesmeyen istekler buraya duser
    model_info:
      id: qwen-chargeback
      mode: chat
      input_cost_per_token:  0.000001      # ornek ic tarife: $1 / 1M token
      output_cost_per_token: 0.000002

  # ---------------------------------------------------------------------------
  # 6) GERCEK ARIZA -- hicbir sey dinlemeyen bir port
  #    Simulasyon degil: baglanti gercekten reddediliyor.
  #    fallback'in calistigini bu model uzerinden gorursun.
  # ---------------------------------------------------------------------------
  # ytu-ce-cosmos/turkish-gpt2 (100M) -- TABAN model, sohbet icin egitilmemis.
  # Bu yuzden hosted_vllm/ (chat) degil, text-completion-openai/ (/v1/completions)
  # kullaniyoruz -- "user: ... assistant: ..." degil, duz metin devami bekler.
  # Backend GGUF degil, kendi PyTorch sunucumuz (hf-sunucu/) -- bkz. compose'daki not.
  - model_name: turkish-gpt2
    litellm_params:
      model: text-completion-openai/turkish-gpt2
      api_base: http://turkish-gpt2:8080/v1
      api_key: "gerekmiyor"
      timeout: 7200
      tags: ["default"]        # etiketi eslesmeyen istekler buraya duser
    model_info:
      id: turkish-gpt2

  # GORUNTU URETME -- image-gen servisi (docker-compose.yml, segmind/tiny-sd).
  # Amac: LiteLLM'in /spend/logs uzerinden girdi+cikti loglamasinin SADECE
  # metin degil, HER istek turunde (resim uretme dahil) calistigini kanitlamak.
  # openai/ onekiyle -- LiteLLM'in image_generation cagrisi (litellm.image_
  # generation) OpenAI'nin /v1/images/generations semasini bekliyor, bizim
  # sunucumuz (hf-sunucu-image/sunucu.py) da bu semaya gore yazildi.
  - model_name: tiny-sd
    litellm_params:
      model: openai/tiny-sd
      api_base: http://image-gen:8080/v1
      api_key: "gerekmiyor"
      timeout: 7200                     # CPU'da goruntu basina 30sn-2dk surebiliyor
      tags: ["default"]
    model_info:
      id: tiny-sd
      mode: image_generation

  # -----------------------------------------------------------------------
  # EGZERSIZ: "BASKA BIR SUNUCUDA CALISAN MODEL" SIMULASYONU
  #
  # disari-model container'i BILEREK docker-compose'un agindan AYRI, izole
  # bir Docker agina (disari-agi) baglandi -- gercek bir dis sunucuyu taklit
  # etsin diye. Kanit: litellm-proxy container'indan `disari-model` adiyla
  # erisim denendi -> "No address associated with hostname" (DNS cozulemedi,
  # farkli agda oldugu icin). Bu yuzden diger tum servislerin aksine (llama-a,
  # qwen-1_5b gibi container adiyla) api_base BURADA host.docker.internal
  # kullaniyor -- host'a acilan 8090 portu uzerinden erisiyoruz, tipki
  # yarin hocadan gelecek gercek bir endpoint'e erisecegimiz gibi.
  - model_name: disaridaki-model-denemesi # -> Benim seçimim
    litellm_params:
      model: hosted_vllm/disaridaki-model # -> Hoca söylemeli (kendi sunucusundaki model adını)
      api_base: http://host.docker.internal:8090/v1
      # GUVENLIK: gercek anahtar burada degil, ortam degiskeninden okunuyor.
      api_key: os.environ/DISARIDAKI_MODEL_API_KEY
      timeout: 7200
      tags: ["default"]
    model_info:
      id: disaridaki-model

  # NOT: turkish-gpt2-vllm (vllm-turkish-gpt2 servisi) artik burada DEGIL --
  # Admin UI'dan hosted_vllm/turkish-gpt2-vllm olarak eklendi (DB'de kayitli,
  # STORE_MODEL_IN_DB: true). Iki ayri kayit (biri burada text-completion-openai/,
  # biri UI'dan hosted_vllm/) DUPLICATE olustugu icin buradaki kaldirildi --
  # kalici olan UI/DB kaydi. mode: completion (turkish-gpt2 TABAN model, sohbet
  # icin egitilmemis, chat_template yok -- /v1/chat/completions calismaz).

  - model_name: olu-endpoint
    litellm_params:
      model: hosted_vllm/hicbir-sey
      api_base: http://llama-a:9999/v1
      api_key: "gerekmiyor"
      timeout: 10
      tags: ["default"]        # etiketi eslesmeyen istekler buraya duser
    model_info:
      id: olu-endpoint
      mode: chat


# =============================================================================
#  ROUTER SETTINGS  --  DAYANIKLILIK
# =============================================================================
router_settings:
  routing_strategy: simple-shuffle

  # ETIKET BAZLI YONLENDIRME -- ACIK
  #
  # OLCULEN: global acikken yonlendirme 12/12 dogru. Istek bazinda
  # (govdede enable_tag_filtering) denendiginde 6/12 -- rastgele.
  # Yani GLOBAL ac, istek bazina guvenme.
  #
  # ONEMLI: global acikken etiketli HER istek, ayni etikete sahip bir
  # deployment bulmak zorundadir. Raporlama amacli serbest etiketler
  # ("kanal:web", "ozellik:police") hicbir deployment'la eslesmez ve
  # istek 401 alir:  "Not allowed to access model due to tags configuration"
  #
  # COZUM: yonlendirme kurali OLMAYAN tum deployment'lara  tags: ["default"]
  # ver. Eslesme bulunamayinca istek bu havuza duser.
  enable_tag_filtering: true
  num_retries: 2
  timeout: 7200                      # uzak/yavas modeller icin genis (onceden 150, sonra 900)
  retry_after: 1
  # 1 hatadan sonra cezalandir. Varsayilan (birkac hata) demoda ve dusuk
  # trafikte esigi gec asiyor; olu backend'e gereksiz istek gidiyor.
  allowed_fails: 1
  cooldown_time: 60
  enable_pre_call_checks: true

  fallbacks:
    - olu-endpoint: ["qwen"]

  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT


# =============================================================================
#  LITELLM SETTINGS
# =============================================================================
litellm_settings:
  drop_params: true

  # Kendi guardrail'imiz: yasakli icerigi engeller, PII maskeler
  callbacks: custom_guardrail.proxy_handler_instance

  # SEMANTIC cache: tam string eslesmesi degil, ANLAM benzerligine bakar.
  # normal "redis" cache'te "user" alani hash'e girdigi icin farkli
  # kullanicilar ayni soruyu sorsa bile MISS oluyordu -- burada izolasyon
  # user degil, api_key/team bazinda yapiliyor, yani ayni anahtari paylasan
  # farkli kullanicilar BENZER sorularda HIT alabiliyor.
  cache: true
  cache_params:
    type: redis-semantic
    redis_url: "redis://redis:6379"   # sifresiz -- host/port/password degil dogrudan URL
    ttl: 300
    similarity_threshold: 0.99              # 1.0 = birebir ayni, 0.0 = her sey.
    # 0.75 cok gevsekti: yapisi benzer (ör. "işte kurallar + kod bloğu + değerlendir")
    # AMA icerigi farkli iki prompt bile HIT aliyordu -- yanlis cevap donuyordu.
    # 0.99 = pratikte sadece BIREBIR AYNI prompt hit alir (embedding FP gurultusune
    # tolerans birakiyor). Gercekten string-hash bazli tam eslesme istersen
    # `type: redis-semantic` yerine `type: redis` yap (o zaman embedding hic yok).
    redis_semantic_cache_embedding_model: embedding   # bizim nomic-embed-text
    # atext_completion/text_completion: /v1/completions (turkish-gpt2, disaridaki-model-denemesi
    # gibi TABAN modeller bu ucu kullaniyor) -- olculdu, listede olmayinca cache
    # mantigi bu istek turu icin HIC calismiyordu (header'da cache-key/similarity
    # hic yok, sessizce atlaniyordu).
    supported_call_types: ["acompletion", "completion", "atext_completion", "text_completion"]

  request_timeout: 7200              # uzak/yavas modeller icin genis (onceden 150, sonra 900)
  set_verbose: false
  json_logs: false


# =============================================================================
#  GENERAL SETTINGS
# =============================================================================
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  proxy_batch_write_at: 5
  disable_spend_logs: false
  health_check_interval: 300

  # Alerting -- "webhook" modu, WEBHOOK_URL ortam degiskenine (docker-compose.yml)
  # ham JSON POST atar. Su an SADECE budget_alerts icin uygulanmis (LiteLLM
  # kaynagi: slack_alerting.py send_alert()). Slack'in kendisi degil, herhangi
  # bir HTTP alicisi -- biz kendi webhook-alici/sunucu.py'mizi dinliyoruz.
  alerting: ["webhook"]

  # HER ISTEKTE "user" ALANI ZORUNLU.
  # Amac: "bu prompt'u kim sordu?" sorusunun cevabi HER KAYITTA olsun.
  # Denetim (audit) gereksinimi olan kurumlarda standarttir.
  #
  # DIKKAT: 'user' gondermeyen istek 400 ile REDDEDILIR. Mevcut
  # uygulamalarini once uyarlamadan uretimde acma.
  # KAPATILDI (false): Playground UI istek govdesine 'user' alani hic
  # eklemiyor -- anahtarin DB'deki user_id'si onemli degil, enforce_user_param
  # sadece govdedeki 'user' alanina bakiyor. Acik oldugunda Playground'dan
  # HICBIR istek gecmiyordu (401). Geri acmak icin true yapip restart edin.
  enforce_user_param: false

  # Prompt + cevap metnini DB'ye yaz -> UI > Logs'ta gorunur.
  # VARSAYILAN false'tur. KVKK notu: acikken kullanici promptlari kalici saklanir.
  store_prompts_in_spend_logs: true
